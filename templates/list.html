<div class="st-lobby">
    <div class="st-lobby-tools">
        <div class="st-lobby-row">
            <!-- 브라우저 기본 ✕는 작고 포커스 때만 보여서(휴대폰에서 키보드를 닫으면 지울 방법이 없다) 직접 둔다 -->
            <div class="st-lobby-search-box">
                <input type="search" class="text_pole st-lobby-search" enterkeyhint="search" autocomplete="off"
                    placeholder="Search names and last messages"
                    data-i18n="[placeholder]chat_lobby.search_placeholder" />
                <button type="button" class="st-lobby-search-clear" hidden title="Clear search" data-i18n="[title]chat_lobby.search_clear">
                    <i class="fa-solid fa-circle-xmark" aria-hidden="true"></i>
                </button>
            </div>
            <!-- 아이콘만 있는 버튼은 휴대폰에서 뜻을 알 수 없어(마우스 설명 없음) 글자를 같이 쓴다 -->
            <button type="button" class="menu_button st-lobby-text-button st-lobby-filter-toggle" aria-expanded="false">
                <i class="fa-solid fa-sliders" aria-hidden="true"></i>
                <span data-i18n="chat_lobby.filter_button">Filter</span>
            </button>
            <button type="button" class="menu_button st-lobby-text-button st-lobby-select-toggle" aria-pressed="false">
                <span data-i18n="chat_lobby.select_button">Select</span>
            </button>
        </div>
        <!-- 캐릭터·정렬은 기본으로 접어 둔다(첫 채팅이 화면 위쪽에 오도록) -->
        <div class="st-lobby-filter-panel" hidden>
            <div class="st-lobby-row">
                <!-- 선택지는 chat-list.js 가 캐릭터·그룹 목록으로 채운다 -->
                <select class="text_pole st-lobby-owner-select" title="Character" data-i18n="[title]chat_lobby.owner_select"></select>
                <select class="text_pole st-lobby-sort" title="Sort" data-i18n="[title]chat_lobby.sort">
                    <option value="recent" data-i18n="chat_lobby.sort_recent">Recent</option>
                    <option value="oldest" data-i18n="chat_lobby.sort_oldest">Oldest</option>
                    <option value="name" data-i18n="chat_lobby.sort_name">Name</option>
                    <option value="messages" data-i18n="chat_lobby.sort_messages">Most messages</option>
                    <option value="owner" data-i18n="chat_lobby.sort_owner">By character</option>
                </select>
            </div>
            <button type="button" class="menu_button st-lobby-footer-button st-lobby-reload">
                <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
                <span data-i18n="chat_lobby.reload">Refresh</span>
            </button>
        </div>
        <!-- 접혀 있어도 필터가 걸려 있는지 알 수 있게 바꾼 것만 한 줄로 -->
        <div class="st-lobby-filter-summary" hidden>
            <i class="fa-solid fa-sliders" aria-hidden="true"></i>
            <span class="st-lobby-filter-summary-text"></span>
            <button type="button" class="st-lobby-filter-clear" title="Clear filters" data-i18n="[title]chat_lobby.filter_clear">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
        </div>
        <div class="st-lobby-note" hidden></div>
    </div>
    <!-- 선택 모드 막대는 목록을 내려도 위에 붙어 있게(.st-lobby 바로 아래에 있어야 sticky 가 목록 끝까지 간다) -->
    <div class="st-lobby-select-bar" hidden>
        <label class="st-lobby-select-all">
            <input type="checkbox" />
            <span data-i18n="chat_lobby.select_all">Select all</span>
        </label>
        <span class="st-lobby-selected-count"></span>
        <button type="button" class="menu_button st-lobby-delete-selected" disabled>
            <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
            <span data-i18n="chat_lobby.delete">Delete</span>
        </button>
        <button type="button" class="menu_button st-lobby-select-done" data-i18n="chat_lobby.done">Done</button>
    </div>
    <div class="st-lobby-list" role="list"></div>
    <div class="st-lobby-footer"></div>
</div>
